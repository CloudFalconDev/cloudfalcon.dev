name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: ${{ matrix.task }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        task: [build, lint, format, type-check, test, lighthouse]
    steps:
      - uses: actions/checkout@v7.0.1
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # Standard tasks (build, lint, format, type-check, test)
      - name: Run ${{ matrix.task }}
        if: matrix.task != 'lighthouse'
        run: pnpm run ${{ matrix.task }}
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || 'test' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'test' }}

      # Lighthouse-specific steps
      - name: Build application
        if: matrix.task == 'lighthouse'
        run: pnpm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || 'test' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'test' }}

      - name: Start Next.js server
        if: matrix.task == 'lighthouse'
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for server
        if: matrix.task == 'lighthouse'
        run: |
          timeout=60
          elapsed=0
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Server is ready"

      - name: Run Lighthouse CI
        if: matrix.task == 'lighthouse'
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/blog
            http://localhost:3000/docs
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

      - name: Post Lighthouse summary
        # Runs even when an assertion fails, so the scores are still reported
        if: ${{ !cancelled() && matrix.task == 'lighthouse' && steps.lighthouse.outputs.resultsPath != '' }}
        uses: actions/github-script@v9
        env:
          LHCI_RESULTS: ${{ steps.lighthouse.outputs.resultsPath }}
        with:
          script: |
            // Scores and report links come from the files lhci writes to .lighthouseci
            const fs = require('fs');
            const readResults = (file, fallback) => {
              const filePath = `${process.env.LHCI_RESULTS}/${file}`;
              return fs.existsSync(filePath) ? JSON.parse(fs.readFileSync(filePath, 'utf8')) : fallback;
            };
            const manifest = readResults('manifest.json', []);
            const links = readResults('links.json', {});
            const assertions = readResults('assertion-results.json', []);

            const categories = [
              ['performance', 'Performance'],
              ['accessibility', 'Accessibility'],
              ['best-practices', 'Best Practices'],
              ['seo', 'SEO'],
            ];
            // manifest is keyed by requested URL and links by final URL, so match on path
            const pagePath = (url) => new URL(url).pathname.replace(/(.)\/$/, '$1');
            const reportByPath = Object.fromEntries(
              Object.entries(links).map(([url, report]) => [pagePath(url), report]),
            );
            // Same colour bands as the Lighthouse report
            const badge = (score) => {
              if (typeof score !== 'number') return '–';
              const value = Math.round(score * 100);
              return `${value >= 90 ? '🟢' : value >= 50 ? '🟠' : '🔴'} ${value}`;
            };
            const round = (value) => (typeof value === 'number' ? Number(value.toFixed(2)) : value);

            const marker = '<!-- lighthouse-summary -->';
            let summary = `${marker}\n## 🔍 Lighthouse results\n\n`;
            summary += `| Page | ${categories.map(([, label]) => label).join(' | ')} | Report |\n`;
            summary += `|------|${categories.map(() => '---').join('|')}|--------|\n`;
            for (const run of manifest.filter((entry) => entry.isRepresentativeRun)) {
              const page = pagePath(run.url);
              const report = reportByPath[page] ? `[View](${reportByPath[page]})` : '–';
              const scores = categories.map(([key]) => badge(run.summary[key]));
              summary += `| \`${page}\` | ${scores.join(' | ')} | ${report} |\n`;
            }

            const failed = assertions.filter((assertion) => !assertion.passed);
            if (failed.length === 0) {
              summary += '\nAll assertions in `.lighthouserc.json` passed.\n';
            } else {
              summary += '\n### Failed assertions\n\n';
              for (const assertion of failed) {
                const icon = assertion.level === 'error' ? '❌' : '⚠️';
                const audit = assertion.auditProperty
                  ? `${assertion.auditId}.${assertion.auditProperty}`
                  : assertion.auditId;
                summary += `- ${icon} \`${pagePath(assertion.url)}\` \`${audit}\`: expected ${assertion.operator} ${round(assertion.expected)}, found ${round(assertion.actual)}\n`;
              }
            }

            await core.summary.addRaw(summary).write();

            // On PRs, keep one comment up to date instead of adding one per push
            if (context.eventName === 'pull_request') {
              try {
                const { owner, repo } = context.repo;
                const issue_number = context.issue.number;
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number,
                  per_page: 100,
                });
                const existing = comments.find(
                  (comment) => comment.user?.type === 'Bot' && comment.body?.startsWith(marker),
                );
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: summary });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: summary });
                }
              } catch (error) {
                core.warning(`Failed to post PR comment: ${error.message}`);
              }
            }

      # Upload coverage for test task
      - name: Upload coverage
        if: matrix.task == 'test'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
