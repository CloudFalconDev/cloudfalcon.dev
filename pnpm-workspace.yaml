allowBuilds:
  core-js: false
  esbuild: true
  msw: false

# Force patched versions of transitive deps flagged by `pnpm audit`.
# All come in via the Sanity CLI (@sanity/cli, @oclif/core) or dev tooling.
overrides:
  js-yaml@3: ^3.15.2
  smol-toml@1: ^1.9.1
  undici@7: ^7.30.1
  minimatch@10: ^11.0.3
  postcss-selector-parser@6: ^6.1.5
